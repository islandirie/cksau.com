<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css">
  <script src="filenames.js"></script>
  <script src="sorting.js"></script>
  <script src="menubar.js"></script>
</head>
<body>
  <nav class="filter-bar" id="filter-bar" aria-label="Portfolio categories">
    <button type="button" class="filter-pill active" data-category="all">All</button>
    <button type="button" class="filter-pill" data-category="web">Web</button>
    <button type="button" class="filter-pill" data-category="logos">Logos</button>
    <button type="button" class="filter-pill" data-category="print">Print</button>
  </nav>

  <div class="gallery" id="gallery"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"></script>
  <script>
    function formatCaption(filePath) {
      const filename = filePath.split("/")[2] || "";
      return filename.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim();
    }

    $(document).ready(function() {
      createMenu();

      const gallery = document.getElementById("gallery");
      const allPortfolioPaths = imageFilePaths.filter((p) => p.split("/")[1] !== "mj");

      let activeCategory = "all";

      function getColumnCount() {
        if (window.innerWidth <= 600) return 2;
        if (window.innerWidth <= 1024) return 3;
        return 5;
      }

      function renderGallery(category) {
        activeCategory = category;
        const paths = category === "all"
          ? allPortfolioPaths
          : sortGalleryByCategory(allPortfolioPaths, category);

        gallery.replaceChildren();

        const colCount = getColumnCount();
        const cols = Array.from({ length: colCount }, () => {
          const col = document.createElement("div");
          col.className = "gallery-col";
          gallery.appendChild(col);
          return col;
        });

        paths.forEach((filePath, index) => {
          const item = document.createElement("div");
          item.className = "item";

          const a = document.createElement("a");
          const captionText = formatCaption(filePath);
          a.setAttribute("data-fancybox", `gallery-${category}`);
          a.setAttribute("data-caption", captionText);
          a.href = filePath;

          const img = document.createElement("img");
          img.src = filePath;
          img.alt = captionText || `Project ${index + 1}`;

          a.appendChild(img);

          const itemCaption = document.createElement("div");
          itemCaption.className = "caption";
          itemCaption.textContent = captionText;

          item.appendChild(a);
          item.appendChild(itemCaption);
          cols[index % colCount].appendChild(item);
        });

        $("[data-fancybox]").fancybox({
          animationEffect: "fade",
          transitionEffect: "slide",
          thumbs: {
            autoStart: false,
          },
        });
      }

      let lastColCount = getColumnCount();
      window.addEventListener("resize", () => {
        const nextColCount = getColumnCount();
        if (nextColCount !== lastColCount) {
          lastColCount = nextColCount;
          renderGallery(activeCategory);
        }
      });

      document.querySelectorAll(".filter-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-pill").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderGallery(btn.getAttribute("data-category"));
        });
      });

      renderGallery("all");
    });
  </script>
</body>
</html>
